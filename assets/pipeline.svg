<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="How I ship: design, build, test, ship, operate">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D4B66"/>
    </marker>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA2F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="210" rx="14" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="899" height="209" rx="14" fill="none" stroke="#232B3A"/>

  <text x="40" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#5A6785" letter-spacing="2.5">HOW I SHIP</text>
  <line x1="40" y1="56" x2="860" y2="56" stroke="#1C2432"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <g>
      <rect x="40" y="80" width="140" height="58" rx="10" fill="#131A26" stroke="#2A3346"/>
      <text x="110" y="104" font-size="14" font-weight="600" fill="#C0CAF5">Design</text>
      <text x="110" y="122" font-size="10" fill="#6B7A99">APIs · schemas</text>
    </g>
    <g>
      <rect x="210" y="80" width="140" height="58" rx="10" fill="#131A26" stroke="#2A3346"/>
      <text x="280" y="104" font-size="14" font-weight="600" fill="#C0CAF5">Build</text>
      <text x="280" y="122" font-size="10" fill="#6B7A99">Python · React</text>
    </g>
    <g>
      <rect x="380" y="80" width="140" height="58" rx="10" fill="#131A26" stroke="#2A3346"/>
      <text x="450" y="104" font-size="14" font-weight="600" fill="#C0CAF5">Test</text>
      <text x="450" y="122" font-size="10" fill="#6B7A99">pytest · QA suites</text>
    </g>
    <g>
      <rect x="550" y="80" width="140" height="58" rx="10" fill="#131A26" stroke="#2A3346"/>
      <text x="620" y="104" font-size="14" font-weight="600" fill="#C0CAF5">Ship</text>
      <text x="620" y="122" font-size="10" fill="#6B7A99">Docker · CI/CD</text>
    </g>
    <g>
      <rect x="720" y="80" width="140" height="58" rx="10" fill="#131A26" stroke="#2A3346"/>
      <text x="790" y="104" font-size="14" font-weight="600" fill="#C0CAF5">Operate</text>
      <text x="790" y="122" font-size="10" fill="#6B7A99">Azure · Grafana</text>
    </g>
  </g>

  <g stroke="#3D4B66" stroke-width="1.5" marker-end="url(#a)">
    <line x1="182" y1="109" x2="206" y2="109"/>
    <line x1="352" y1="109" x2="376" y2="109"/>
    <line x1="522" y1="109" x2="546" y2="109"/>
    <line x1="692" y1="109" x2="716" y2="109"/>
  </g>

  <rect x="40" y="164" width="220" height="2" rx="1" fill="url(#glow)">
    <animate attributeName="x" values="40;640;40" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>
  <line x1="40" y1="165" x2="860" y2="165" stroke="#1C2432" stroke-width="0.75"/>

  <text x="450" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#4E5A70" text-anchor="middle">Python · JavaScript · Java · SQL · Docker · Azure · AWS</text>
</svg>
